name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Select Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Cache pnpm dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare
      - run: pnpm --filter @bouvet-team-photobooth/web db:generate
        env:
          DATABASE_URL: postgresql://photobooth:photobooth@127.0.0.1:5432/photobooth
      - run: pnpm --filter @bouvet-team-photobooth/web exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: playwright-failure-evidence-${{ runner.os }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://photobooth:photobooth@127.0.0.1:5432/photobooth_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: photobooth_test
          POSTGRES_PASSWORD: photobooth
          POSTGRES_USER: photobooth
        options: >-
          --health-cmd "pg_isready -U photobooth -d photobooth_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 5s
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Select Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Cache pnpm dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare
      - run: pnpm --filter @bouvet-team-photobooth/web db:generate
        env:
          DATABASE_URL: postgresql://photobooth:photobooth@127.0.0.1:5432/photobooth_test
      - run: pnpm --filter @bouvet-team-photobooth/web exec playwright install --with-deps chromium
      - run: pnpm test:db
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: playwright-database-failure-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
