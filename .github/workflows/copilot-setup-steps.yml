name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - '**/package.json'
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .nvmrc

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Select Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install pinned pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Cache pnpm dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NUXT_TELEMETRY_DISABLED: '1'
      - run: pnpm prepare
      - run: pnpm --filter @bouvet-team-photobooth/web db:generate
        env:
          DATABASE_URL: postgresql://photobooth:photobooth@127.0.0.1:5432/photobooth
      - run: pnpm --filter @bouvet-team-photobooth/web exec playwright install --with-deps chromium
